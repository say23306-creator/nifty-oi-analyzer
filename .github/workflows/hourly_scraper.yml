name: Nifty 50 Hourly OI Cloud Scraper

on:
  schedule:
    # 09:15, 10:15, 11:15, 12:15, 13:15, 14:15, 15:15 IST (Monday to Friday)
    - cron: '45 3,4,5,6,7,8,9 * * 1-5'
    # 15:30 IST Market Close (Monday to Friday)
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force execution even on holidays/weekends'
        required: false
        default: false
        type: boolean

jobs:
  collect-hourly-oi:
    name: Scrape & Store to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hourly Collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scraper/cloud_runner.py --force
          else
            python scraper/cloud_runner.py
          fi

